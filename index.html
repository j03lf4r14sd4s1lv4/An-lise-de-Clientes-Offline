<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem e Limpeza de Clientes</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .contador { font-size: 24px; margin: 20px 0; background: #f4f4f4; padding: 15px; border-radius: 5px; display: inline-block; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin-right: 10px; }
        .btn-deletar { background-color: #ff4d4d; color: white; border: none; border-radius: 5px; }
        .btn-deletar:hover { background-color: #cc0000; }
        #listaClientes { margin-top: 20px; border-top: 1px solid #ccc; padding-top: 20px; }
    </style>
</head>
<body>

    <!-- Contador -->
    <div class="contador">
        Contagem: <span id="numeroContagem">0</span>
    </div>

    <!-- Upload do arquivo -->
    <input type="file" id="arquivoInput" accept=".csv,.txt,.json">
    
    <!-- Botão para Deletar Tudo -->
    <button class="btn-deletar" onclick="deletarTodos()">Deletar Tudo</button>

    <!-- Área onde os dados aparecem -->
    <div id="listaClientes"></div>

    <script>
        document.getElementById('arquivoInput').addEventListener('change', function(evento) {
            const arquivo = evento.target.files[0];
            if (!arquivo) return;

            const leitor = new FileReader();

            leitor.onload = function(e) {
                const conteudo = e.target.result;
                
                let linhas = conteudo.split('\n');
                let linhasValidas = linhas.filter(linha => linha.trim() !== '');
                
                // Se tiver cabeçalho, subtrai 1, senão conta tudo
                let total = linhasValidas.length; 

                // Atualiza o contador
                document.getElementById('numeroContagem').innerText = total;
                
                // Exibe os dados (opcional, se você quiser ver quem são)
                // document.getElementById('listaClientes').innerHTML = linhasValidas.join('<br>');
                console.log("Total de registros: " + total);
            };

            leitor.readAsText(arquivo, 'UTF-8');
        });

        // ====== FUNÇÃO PARA DELETAR TUDO ======
        function deletarTodos() {
            if(confirm("Tem certeza que deseja deletar todos os dados da tela?")) {
                // 1. Zera o contador
                document.getElementById('numeroContagem').innerText = "0";
                
                // 2. Limpa a lista exibida na tela (se você estiver mostrando uma tabela/lista)
                document.getElementById('listaClientes').innerHTML = "";
                
                // 3. (Opcional) Limpa o campo de arquivo para recomeçar
                document.getElementById('arquivoInput').value = "";
                
                alert("Dados deletados com sucesso!");
            }
        }
    </script>

</body>
</html>
